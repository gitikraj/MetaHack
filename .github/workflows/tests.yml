name: Tests & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r project/requirements.txt
        pip install flake8 black pytest
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check formatting with black
      run: |
        black --check . --diff --exclude=".git,__pycache__,build,dist,.venv,openenv" || true
    
    - name: Import tests
      run: |
        python -c "from agents import *; print('✅ Agents imported')"
        python -c "from openenv import *; print('✅ OpenEnv imported')"
        python -c "from schemas import *; print('✅ Schemas imported')"
    
    - name: Environment tests
      run: |
        python -c "from openenv import CyberMultiAgentEnv; print('✅ Environment created')"
